# Parameters for one behavior-endpoints run.
# Location: <project>/analysis/behavior-endpoints/<run_label>/behavior-endpoints.yml
# Render:   quarto render behavior-endpoints.qmd --execute-params behavior-endpoints.yml
#
# Every value below is a scientific/study choice. Fill it in WITH the user;
# never guess. Values marked REQUIRED have no default.

# REQUIRED. Must equal this run folder's name (letters, digits, '-', '_').
run_label: "CHANGE_ME"

# Project root relative to this run folder.
project_root: "../../.."

# REQUIRED. Exactly one complete dataset-import-qc run folder (relative to the
# project root), plus zero or more complete QC runs of that same import whose
# `excluded_plates` are dropped (e.g. analysis/interplate-vc-qc/<run>).
upstream:
  - analysis/dataset-import-qc/CHANGE_ME

# REQUIRED. Phase windows (time_value, inclusive) for total distance,
# distance change and distance shift; one endpoint set per segment, in this
# order. Example: L1 1-10, D1 11-20, L2 21-30, D2 31-40,
# D2-ext 41-50. To merge the second dark phase, use D2: {from: 31, to: 50}
# and no D2-ext. Segments must not overlap.
segments:
  L1: {from: 1, to: 10}
  D1: {from: 11, to: 20}

# REQUIRED. Window(s) for movement similarity, usually the whole assay,
# e.g. LD: {from: 1, to: 50}.
similarity_segments:
  LD: {from: 1, to: 20}

# Movement similarity metric(s): spearman (default) | pearson | cosine | euclidean
similarity_metrics: [spearman]

# Normalization per endpoint type (per plate, against the plate's vehicle
# control). Defaults: total_distance log_diff, distance_change_shift none,
# movement_similarity ratio. Allowed: none | ratio | log_diff | log_ratio.
# Non-default choices are recorded per row and flagged in the report.
normalization:
  total_distance: log_diff
  distance_change_shift: none
  movement_similarity: ratio

# Plot layout (endpoints are always calculated and normalized per plate):
#   per_plate          - one panel per plate (default)
#   by_chemical_pooled - one panel per chemical; points coloured by plate
layout: per_plate

# Column identifying "the same chemical" across plates (by_chemical_pooled),
# e.g. DTXSID; must have no missing values.
chemical_col: DTXSID

# Panel title: these columns joined with " | ", constant within a panel.
# Empty = plate_id (per_plate) or chemical_col (by_chemical_pooled).
title_cols: []
title_wrap_width: 40

# Panel order: alphabetical (by title, case-insensitive) | group_key.
panel_order: alphabetical

# Panels (plates or chemicals) per page, side by side.
ncol: 4

# PDF size in inches: width, and height per endpoint row (+ 1.5 in for
# titles/axes), so each PDF fits its number of endpoint rows.
pdf_width: 15
pdf_height_per_row: 2.2
